[project]
name = "agentic-secrets"
version = "0.1.0"
description = "Envelope encryption of workspace secrets and log redaction for the Agentic Dev Platform"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45",
    "pydantic>=2.11",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
