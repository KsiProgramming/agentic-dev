[project]
name = "agentic-store"
version = "0.1.0"
description = "Postgres persistence (SQLAlchemy models, run event sink) for the Agentic Dev Platform"
requires-python = ">=3.12"
dependencies = [
    "agentic-engine",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0.43",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
