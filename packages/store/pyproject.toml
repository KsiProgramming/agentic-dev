[project]
name = "agentic-store"
version = "0.1.0"
description = "Postgres persistence (models, runs, run event sink) and the Redis run queue for the Agentic Dev Platform"
requires-python = ">=3.12"
dependencies = [
    "agentic-engine",
    "agentic-sandbox",
    "asyncpg>=0.30",
    "redis>=6.4",
    "sqlalchemy[asyncio]>=2.0.43",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
