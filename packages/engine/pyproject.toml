[project]
name = "agentic-engine"
version = "0.1.0"
description = "Orchestration engine and run worker for the Agentic Dev Platform"
requires-python = ">=3.12"
dependencies = [
    "agentic-runtime",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "redis>=6.4",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
