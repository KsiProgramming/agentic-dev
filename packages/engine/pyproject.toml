[project]
name = "agentic-engine"
version = "0.1.0"
description = "Orchestration engine for the Agentic Dev Platform"
requires-python = ">=3.12"
dependencies = [
    "agentic-runtime",
    "cel-python>=0.5.0",
    "langgraph>=1.2.16",
    "pydantic>=2.11",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
