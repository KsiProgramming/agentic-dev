# Forward HTTPS (`CONNECT` to port 443) to the hosts in /etc/tinyproxy/allow only; refuse plain
# HTTP and every other host. Refusals are logged at Notice ("Proxying refused on filtered domain").
Port 3128
Listen 0.0.0.0
Timeout 60
MaxClients 64
LogLevel Notice
Syslog Off
DisableViaHeader Yes
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
Filter "/etc/tinyproxy/allow"
ConnectPort 443
Allow 0.0.0.0/0
