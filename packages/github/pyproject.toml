[project]
name = "agentic-github"
version = "0.1.0"
description = "GitHub App client (installations and repos) for the Agentic Dev Platform"
requires-python = ">=3.12"
dependencies = [
    "agentic-secrets",
    "cryptography>=45",
    "githubkit[auth-app]>=0.13",
    "pydantic>=2.11",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
