[project]
name = "agentic-runtime"
version = "0.1.0"
description = "Agent runtime interface and provider adapters for the Agentic Dev Platform"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17",
    "httpx2>=2.0,<3",
    "jsonschema>=4.26",
    "pydantic>=2.11",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
