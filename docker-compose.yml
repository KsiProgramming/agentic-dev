# Local dev stack. Usage: cp .env.example .env && docker compose up --build
# Postgres and Redis are not published to the host; only the API and web are.

x-db-env: &db-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD:-agentic}@postgres:5432/${POSTGRES_DB:-agentic}
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentic}
      POSTGRES_DB: ${POSTGRES_DB:-agentic}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: agentic-dev/python:dev
    environment: *db-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: agentic-dev/python:dev
    command: ["python", "-m", "agentic_worker"]
    environment:
      <<: *db-env
      READY_FILE: /tmp/worker-ready
      # Agents run on the fake runtime unless AGENTIC_RUNTIME=claude (then ANTHROPIC_API_KEY is
      # required). FAKE_STEP_DELAY_S paces fake events so a run streams visibly.
      AGENTIC_RUNTIME: ${AGENTIC_RUNTIME:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      FAKE_STEP_DELAY_S: ${FAKE_STEP_DELAY_S:-0.5}
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: web
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
