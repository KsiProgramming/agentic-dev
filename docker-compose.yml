# Local dev stack. Usage: cp .env.example .env && docker compose up --build
# Postgres and Redis are not published to the host; only the API and web are.

x-db-env: &db-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD:-agentic}@postgres:5432/${POSTGRES_DB:-agentic}
  REDIS_URL: redis://redis:6379/0

# The master key that encrypts stored secrets, made once by `keygen` and kept in the `secrets`
# volume. Deleting that volume makes stored keys unreadable: they must be entered again.
x-master-key: &master-key
  MASTER_KEY_FILE: /secrets/master.key

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentic}
      POSTGRES_DB: ${POSTGRES_DB:-agentic}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  keygen:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: agentic-dev/python:dev
    command: ["python", "-m", "agentic_secrets", "generate-key", "/secrets/master.key", "--if-missing"]
    volumes:
      - secrets:/secrets
    healthcheck:
      disable: true

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: agentic-dev/python:dev
    environment:
      <<: [*db-env, *master-key]
      # The browser calls the API directly, so the web app's origin must be allowed.
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}"]'
      # The platform's GitHub App (README, "GitHub App"). Left blank, the GitHub endpoints
      # answer 503 and the rest works. Its private key is read from ./.secrets/github-app.pem.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY_FILE: /github/github-app.pem
      # GitHub's install redirect comes back to the API, which sends the browser on to the web app.
      WEB_BASE_URL: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - secrets:/secrets:ro
      - ./.secrets:/github:ro
    depends_on:
      keygen:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Builds the image run sandboxes are made from (alpine + git); the worker starts the containers.
  sandbox-image:
    build:
      context: packages/sandbox
    image: agentic-dev/sandbox:dev
    command: ["true"]
    network_mode: none

  worker:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: agentic-dev/python:dev
    command: ["python", "-m", "agentic_worker"]
    environment:
      <<: [*db-env, *master-key]
      READY_FILE: /tmp/worker-ready
      # Agents run on the fake runtime unless AGENTIC_RUNTIME=claude: then each run uses the
      # Claude key stored in its workspace (the web app's Settings page). FAKE_STEP_DELAY_S paces
      # fake events so a run streams visibly.
      AGENTIC_RUNTIME: ${AGENTIC_RUNTIME:-fake}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      # Output tokens per API call and tool-use turns per agent node.
      CLAUDE_MAX_TOKENS: ${CLAUDE_MAX_TOKENS:-32000}
      CLAUDE_MAX_TURNS: ${CLAUDE_MAX_TURNS:-50}
      FAKE_STEP_DELAY_S: ${FAKE_STEP_DELAY_S:-0.5}
      # A run whose worker stops renewing its lease for LEASE_TTL_S is resumed by another worker.
      LEASE_TTL_S: ${LEASE_TTL_S:-30}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      # Runs with a repo get a sandbox container on the host's Docker. Local repo paths may only
      # come from /samples, where this project's own git history is mounted as a demo repo.
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-docker}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-agentic-dev/sandbox:dev}
      SANDBOX_LOCAL_ROOT: /samples
      # The same GitHub App as the API: runs on GitHub repos clone with an installation token,
      # and `github.openPR` pushes a writer's branch and opens a pull request (after a gate).
      # Left blank, GitHub repos are cloned anonymously and runs that use github.* tools fail.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY_FILE: /github/github-app.pem
    # The Docker socket gives the worker control of the host's Docker (dev only; phase 10.2
    # replaces it). DOCKER_GID is the socket's group: 0 on Docker Desktop, `docker` on Linux.
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.git:/samples/agentic-dev.git:ro
      - secrets:/secrets:ro
      - ./.secrets:/github:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully

  web:
    build:
      context: web
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  secrets:
