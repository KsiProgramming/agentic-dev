# Local dev stack. Usage: cp .env.example .env && docker compose up --build
# Postgres and Redis are not published to the host; only the API and web are.

x-db-env: &db-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD:-agentic}@postgres:5432/${POSTGRES_DB:-agentic}
  REDIS_URL: redis://redis:6379/0

# The master key that encrypts stored secrets, made once by `keygen` and kept in the `secrets`
# volume. Deleting that volume makes stored keys unreadable: they must be entered again.
x-master-key: &master-key
  MASTER_KEY_FILE: /secrets/master.key

# Fakes for local dev and the e2e tests (CI turns them on), refused with AGENTIC_ENV=production.
# AGENTIC_GITHUB=fake stands in a GitHub App with repos e2e-org/docs-demo and e2e-org/private-lib,
# kept as bare repos in the `fixtures` volume, where the repos runs create go too;
# CLAUDE_KEY_CHECK=fake accepts keys starting `sk-ant-test-` without calling Anthropic;
# AGENTIC_JIRA=fake stands in an Atlassian account that reaches two Jira sites (7.1).
x-fakes: &fakes
  AGENTIC_ENV: ${AGENTIC_ENV:-development}
  AGENTIC_GITHUB: ${AGENTIC_GITHUB:-app}
  AGENTIC_JIRA: ${AGENTIC_JIRA:-app}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentic}
      POSTGRES_DB: ${POSTGRES_DB:-agentic}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  keygen:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: agentic-dev/python:dev
    command: ["python", "-m", "agentic_secrets", "generate-key", "/secrets/master.key", "--if-missing"]
    volumes:
      - secrets:/secrets
    healthcheck:
      disable: true

  # Seeds the fake GitHub App's bare repos (once; later runs keep what was pushed to them).
  fixtures:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: agentic-dev/python:dev
    command: ["sh", "/scripts/seed_fixture_repos.sh", "/samples"]
    volumes:
      - fixtures:/samples/e2e-org
      - ./scripts/seed_fixture_repos.sh:/scripts/seed_fixture_repos.sh:ro
    depends_on:
      keygen:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: agentic-dev/python:dev
    environment:
      <<: [*db-env, *master-key, *fakes]
      CLAUDE_KEY_CHECK: ${CLAUDE_KEY_CHECK:-anthropic}
      # A run queued this long with no worker holding it is shown as stalled (phase 12.1); the
      # worker reads the same value.
      QUEUE_STALE_S: ${QUEUE_STALE_S:-60}
      # Where the browser reaches the API (the fake GitHub install flow redirects back to it).
      API_BASE_URL: http://localhost:${API_PORT:-8000}
      # The browser calls the API directly, so the web app's origin must be allowed.
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}"]'
      # The platform's GitHub App (docs/development/developer-reference.md, "GitHub App"). Left blank, the GitHub endpoints
      # answer 503 and the rest works. Its private key is read from ./.secrets/github-app.pem.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY_FILE: /github/github-app.pem
      # The secret the App signs its webhook deliveries with (7.6): review comments on a run's
      # pull request reach <API_BASE_URL>/github/webhooks. Blank: that endpoint answers 503.
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # The deployment's Atlassian OAuth 2.0 (3LO) app, for Jira (7.1). Its callback URL is
      # <API_BASE_URL>/jira/callback. Left blank, the Jira card says it is not configured. Its
      # client secret is read from ./.secrets/atlassian-client-secret.
      ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID:-}
      ATLASSIAN_CLIENT_SECRET_FILE: /github/atlassian-client-secret
      # The deployment's OAuth app for personal GitHub connections, which let each person run
      # Copilot on their own account (8.2). Its callback URL is <API_BASE_URL>/github-user/callback.
      # Left blank, the card says personal connections are not configured. Its client secret is
      # read from ./.secrets/github-user-client-secret.
      GITHUB_USER_CLIENT_ID: ${GITHUB_USER_CLIENT_ID:-}
      GITHUB_USER_CLIENT_SECRET_FILE: /github/github-user-client-secret
      GITHUB_USER_SCOPES: ${GITHUB_USER_SCOPES:-}
      # Where Jira posts the webhook deliveries that start runs (7.3): <this>/jira/webhooks. Jira
      # must reach it from the internet; in development, a tunnel's URL. Blank: API_BASE_URL.
      JIRA_WEBHOOK_BASE_URL: ${JIRA_WEBHOOK_BASE_URL:-}
      # GitHub's install redirect comes back to the API, which sends the browser on to the web app.
      WEB_BASE_URL: http://localhost:${WEB_PORT:-3000}
      # With AGENTIC_GITHUB=fake, the fake App's bare repos (shared with the worker), so the API
      # sees the repos runs create.
      FAKE_GITHUB_ROOT: /samples
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - secrets:/secrets:ro
      - ./.secrets:/github:ro
      - fixtures:/samples/e2e-org:ro
    depends_on:
      keygen:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Builds the image run sandboxes are made from (alpine, git and the scanners of the `scan` tools);
  # the worker starts the containers.
  sandbox-image:
    build:
      context: packages/sandbox
    image: agentic-dev/sandbox:dev
    command: ["true"]
    network_mode: none

  # The package egress proxies (4.8, 13.2): the only route out for a sandbox's restore job, one per
  # registry from one image with one config each. Jobs reach theirs on `agentic-<registry>`, an
  # internal network with no other way out, so a job for npm cannot reach PyPI or NuGet. Each proxy
  # alone also sits on the default network, which has internet access. It forwards HTTPS to its
  # registry's hosts (nuget: api.nuget.org; npm: registry.npmjs.org; pypi: pypi.org and
  # files.pythonhosted.org) and logs every host it refuses.
  egress-proxy:
    build:
      context: packages/egress-proxy
    image: agentic-dev/egress-proxy:dev
    networks:
      default:
      nuget:
        aliases: [egress-proxy]

  egress-proxy-npm:
    image: agentic-dev/egress-proxy:dev
    command: ["tinyproxy", "-d", "-c", "/etc/tinyproxy/npm.conf"]
    depends_on: [egress-proxy]
    networks:
      default:
      npm:
        aliases: [egress-proxy-npm]

  egress-proxy-pypi:
    image: agentic-dev/egress-proxy:dev
    command: ["tinyproxy", "-d", "-c", "/etc/tinyproxy/pypi.conf"]
    depends_on: [egress-proxy]
    networks:
      default:
      pypi:
        aliases: [egress-proxy-pypi]

  worker:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: agentic-dev/python:dev
    command: ["python", "-m", "agentic_worker"]
    environment:
      <<: [*db-env, *master-key, *fakes]
      READY_FILE: /tmp/worker-ready
      # Agents run on the fake runtime unless AGENTIC_RUNTIME=claude: then each run uses the
      # Claude key stored in its workspace (the web app's Settings page). FAKE_STEP_DELAY_S paces
      # fake events so a run streams visibly.
      AGENTIC_RUNTIME: ${AGENTIC_RUNTIME:-fake}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      # Output tokens per API call and tool-use turns per agent node.
      CLAUDE_MAX_TOKENS: ${CLAUDE_MAX_TOKENS:-32000}
      CLAUDE_MAX_TURNS: ${CLAUDE_MAX_TURNS:-50}
      FAKE_STEP_DELAY_S: ${FAKE_STEP_DELAY_S:-0.5}
      # A run whose worker stops renewing its lease for LEASE_TTL_S is resumed by another worker.
      LEASE_TTL_S: ${LEASE_TTL_S:-30}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      # How often the worker cancels runs whose gate waited past its time to live (phase 11.3).
      GATE_SWEEP_S: ${GATE_SWEEP_S:-30}
      # Every QUEUE_SWEEP_S, runs queued with no worker holding them for QUEUE_STALE_S are queued
      # again: their id was lost before a worker claimed them (phase 12.1).
      QUEUE_STALE_S: ${QUEUE_STALE_S:-60}
      QUEUE_SWEEP_S: ${QUEUE_SWEEP_S:-15}
      # Every SANDBOX_SWEEP_S, the sandboxes failed and cancelled runs kept past their time to live
      # are removed, and saved bundles past their run's retention dropped (phase 12.3).
      SANDBOX_SWEEP_S: ${SANDBOX_SWEEP_S:-60}
      # Every JIRA_WEBHOOK_SWEEP_S, the Jira trigger webhooks that expire within 10 days are
      # renewed, those Jira dropped registered again, and old deliveries pruned (phase 7.3).
      JIRA_WEBHOOK_SWEEP_S: ${JIRA_WEBHOOK_SWEEP_S:-21600}
      # Runs with a repo get a sandbox container on the host's Docker. Local repo paths may only
      # come from /samples, where this project's own git history is mounted as a demo repo.
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-docker}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-agentic-dev/sandbox:dev}
      SANDBOX_LOCAL_ROOT: /samples
      # A restore job runs on its registry's network and reaches only that registry, through its
      # proxy (4.8, 13.2).
      SANDBOX_NUGET_NETWORK: agentic-nuget
      SANDBOX_NUGET_PROXY: http://egress-proxy:3128
      SANDBOX_NPM_NETWORK: agentic-npm
      SANDBOX_NPM_PROXY: http://egress-proxy-npm:3128
      SANDBOX_PYPI_NETWORK: agentic-pypi
      SANDBOX_PYPI_PROXY: http://egress-proxy-pypi:3128
      # The same GitHub App as the API: runs on GitHub repos clone with an installation token,
      # and `github.openPR` pushes a writer's branch and opens a pull request (after a gate).
      # Left blank, GitHub repos are cloned anonymously and runs that use github.* tools fail.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY_FILE: /github/github-app.pem
      # The same Atlassian app as the API: the jira.* tools (7.2) refresh the workspace's Jira
      # grant with it. Left blank, runs that use jira.* tools fail.
      ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID:-}
      ATLASSIAN_CLIENT_SECRET_FILE: /github/atlassian-client-secret
      # The same OAuth app as the API: a run on a person's Copilot (8.2) refreshes their token with
      # it. Left blank, such a run fails with copilot_not_configured.
      GITHUB_USER_CLIENT_ID: ${GITHUB_USER_CLIENT_ID:-}
      GITHUB_USER_CLIENT_SECRET_FILE: /github/github-user-client-secret
      COPILOT_MODEL: ${COPILOT_MODEL:-auto}
      # A Jira comment a run posts ends with a link to the run here.
      WEB_BASE_URL: http://localhost:${WEB_PORT:-3000}
    # The Docker socket gives the worker control of the host's Docker (dev only; phase 10.2
    # replaces it). DOCKER_GID is the socket's group: 0 on Docker Desktop, `docker` on Linux.
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.git:/samples/agentic-dev.git:ro
      - fixtures:/samples/e2e-org
      - secrets:/secrets:ro
      - ./.secrets:/github:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully
      egress-proxy:
        condition: service_started
      fixtures:
        condition: service_completed_successfully

  web:
    build:
      context: web
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  secrets:
  fixtures:

networks:
  # Sandbox restore jobs and one registry's egress proxy only; `internal` gives each no route out
  # (4.8, 13.2). Named outright, as the worker attaches job containers to them by name.
  nuget:
    name: agentic-nuget
    internal: true
  npm:
    name: agentic-npm
    internal: true
  pypi:
    name: agentic-pypi
    internal: true
