name: PR checks

# Rules every PR must meet before merge. Kept separate from CI so adding or
# removing a skip label does not rerun the full pipeline.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    name: CHANGELOG.md updated
    runs-on: ubuntu-latest
    # Every PR, with no skip label: a squash merge to main always lands with its entry.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG.md entry under [Unreleased]
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git show "$HEAD_SHA:CHANGELOG.md" | grep -qx '## \[Unreleased\]'; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no '## [Unreleased]' section."
            exit 1
          fi
          if git diff -U0 "$BASE_SHA...$HEAD_SHA" -- CHANGELOG.md | grep -q '^+[^+]'; then
            echo "CHANGELOG.md is updated."
          else
            echo "::error file=CHANGELOG.md::Add your changes under [Unreleased] in CHANGELOG.md."
            exit 1
          fi

  roadmap:
    name: Roadmap phase marked done
    runs-on: ubuntu-latest
    # Planning-only PRs (spec written, not implemented yet) use the skip-roadmap label.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-roadmap') }}
    # Pushes the "mark phase done" commit to the PR branch.
    permissions:
      contents: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      # Fork branches cannot be pushed to; those PRs only get the check.
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          # Commits pushed with the default GITHUB_TOKEN do not trigger new workflow runs.
          # Set ROADMAP_BOT_TOKEN (PAT or GitHub App token) if required checks must rerun.
          token: ${{ secrets.ROADMAP_BOT_TOKEN || github.token }}
      - name: Mark implemented phases done in specs/roadmap.md
        if: ${{ env.SAME_REPO == 'true' }}
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 scripts/check_roadmap.py "$BASE_SHA" HEAD --mark-done "$PR_URL"
          if git diff --quiet -- specs/roadmap.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mark roadmap phase done for ${PR_URL##*/}" -- specs/roadmap.md
          git push origin "HEAD:refs/heads/$HEAD_REF"
      - name: Require implemented phases to be marked done in specs/roadmap.md
        run: python3 scripts/check_roadmap.py "$BASE_SHA" HEAD
