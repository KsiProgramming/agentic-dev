name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"
  NODE_VERSION: "24"

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/export_workflow_schema.py
      - name: Fail if the committed workflow spec schema is stale
        run: |
          git diff --exit-code -- schemas/ || {
            echo "::error::Run 'uv run python scripts/export_workflow_schema.py' and commit the result."
            exit 1
          }
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - uses: docker/setup-buildx-action@v4.4.1
      # Cached: the image holds the scanners and the ~290 MB OSV database (4.4).
      - name: Build the sandbox image (Docker tests run in it)
        uses: docker/build-push-action@v7.4.0
        with:
          context: packages/sandbox
          tags: agentic-dev/sandbox:dev
          load: true
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,scope=sandbox,mode=max
      - run: uv run pytest

  sandbox-arm64:
    # The sandbox image pins the .NET SDK and every scanner per architecture (4.8); the Python job
    # builds and tests amd64, this checks the arm64 digests and downloads still resolve.
    name: Sandbox image (arm64 build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build the sandbox image for arm64
        uses: docker/build-push-action@v7.4.0
        with:
          context: packages/sandbox
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=sandbox-arm64
          cache-to: type=gha,scope=sandbox-arm64,mode=max
      - name: Build the egress proxy image
        uses: docker/build-push-action@v7.4.0
        with:
          context: packages/egress-proxy
          platforms: linux/amd64,linux/arm64
          push: false

  web:
    name: Web (lint, types, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  api-contract:
    name: API contract (generated client is up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: uv sync --frozen
      - run: uv run python scripts/export_openapi.py
      - run: pnpm install --frozen-lockfile && pnpm gen:api
        working-directory: web
      - name: Fail if the committed spec or client is stale
        run: |
          git diff --exit-code -- web/openapi.json web/src/api/ || {
            echo "::error::Run 'uv run python scripts/export_openapi.py && (cd web && pnpm gen:api)' and commit the result."
            exit 1
          }

  smoke:
    name: Compose smoke test + e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure the stack
        # The worker reaches Docker through its socket, whose group differs per host.
        run: |
          cp .env.example .env
          echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> .env
          # The e2e journey runs on the fake GitHub App and Claude key check (phase 2.6).
          echo "AGENTIC_GITHUB=fake" >> .env
          echo "CLAUDE_KEY_CHECK=fake" >> .env
          # The approval expiry e2e test waits for a gate with a 2 s time to live (phase 11.3).
          echo "GATE_SWEEP_S=1" >> .env
      - name: Start stack
        # Three workers: each takes one run at a time, and the e2e suite starts runs from several
        # browsers at once; with one, runs queue behind each other and gates time out. Workers
        # share runs through their leases, as in production.
        run: docker compose up -d --build --wait --wait-timeout 180 --scale worker=3
      - name: Probe endpoints
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/health/ready
          curl -fsS -o /dev/null http://localhost:3000
      - name: Sandbox demo (phase 1.1)
        # An agent lists the files of this repo, cloned into a sandbox container; none is left.
        run: |
          python3 scripts/sandbox_demo.py --api http://localhost:8000
          # The run ends before its sandbox is removed, so wait for the removal (bounded).
          timeout 30 sh -c 'while [ -n "$(docker ps -aq --filter label=agentic.run_id)" ]; do sleep 1; done'
      - name: Repo MCP demo (phase 1.2)
        # An agent lists, reads and searches this repo through the repo MCP server; none is left.
        run: |
          python3 scripts/sandbox_demo.py --api http://localhost:8000 \
            --spec packages/engine/tests/fixtures/specs/valid/ask-repo.json \
            --expect "packages/tools/" \
            --expect 'members = ["packages/*"]' \
            --expect "packages/tools/pyproject.toml:1: [project]"
          timeout 30 sh -c 'while [ -n "$(docker ps -aq --filter label=agentic.run_id)" ]; do sleep 1; done'
      - name: Repo write demo (phase 1.6)
        # A writer agent commits NOTES.md on agent/<run>/writer in its worktree, then a tool node
        # lists the shared checkout; nothing is pushed and no sandbox is left.
        run: |
          python3 scripts/sandbox_demo.py --api http://localhost:8000 \
            --spec packages/engine/tests/fixtures/specs/valid/write-file.json \
            --expect "wrote NOTES.md (" \
            --expect "/writer: NOTES.md"
          timeout 30 sh -c 'while [ -n "$(docker ps -aq --filter label=agentic.run_id)" ]; do sleep 1; done'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Playwright
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:3000
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Compose logs
        if: always()
        run: docker compose logs --no-color
      - name: Upload layout screenshots (phase 2.2)
        # Every page at 375, 768, 1024 and 1440 px, for review; overflow is asserted in the tests.
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: layout-screenshots
          path: web/test-results/screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
      - name: Stop stack
        if: always()
        run: docker compose down -v
