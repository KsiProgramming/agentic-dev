name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"
  NODE_VERSION: "24"

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/export_workflow_schema.py
      - name: Fail if the committed workflow spec schema is stale
        run: |
          git diff --exit-code -- schemas/ || {
            echo "::error::Run 'uv run python scripts/export_workflow_schema.py' and commit the result."
            exit 1
          }
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  web:
    name: Web (lint, types, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  api-contract:
    name: API contract (generated client is up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: uv sync --frozen
      - run: uv run python scripts/export_openapi.py
      - run: pnpm install --frozen-lockfile && pnpm gen:api
        working-directory: web
      - name: Fail if the committed spec or client is stale
        run: |
          git diff --exit-code -- web/openapi.json web/src/api/ || {
            echo "::error::Run 'uv run python scripts/export_openapi.py && (cd web && pnpm gen:api)' and commit the result."
            exit 1
          }

  smoke:
    name: Compose smoke test + e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Probe endpoints
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/health/ready
          curl -fsS -o /dev/null http://localhost:3000
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Playwright
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:3000
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Compose logs
        if: always()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
      - name: Stop stack
        if: always()
        run: docker compose down -v
